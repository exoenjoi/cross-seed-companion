{% extends "base.html" %}
{% block content %}
<span class="section-tag">03 · Logs</span>
<h1 class="page-title">
  Logs cross-seed
  {% if selected_day == "current" %}(temps réel){% else %}— {{ selected_day }}{% endif %}
</h1>

<div class="log-controls">
  <select id="log-day-select" class="log-day-select">
    <option value="current" {% if selected_day == "current" %}selected{% endif %}>Aujourd'hui</option>
    {% for d in available_days %}
      <option value="{{ d }}" {% if d == selected_day %}selected{% endif %}>{{ d }}</option>
    {% endfor %}
  </select>
  <input type="text" id="log-filter" class="log-filter" placeholder="Filtrer...">
</div>

<div id="log-container" class="log-container">
  {% for entry in entries %}
    {% include "_log_line.html" %}
  {% endfor %}
</div>

<script>
  (function () {
    var container = document.getElementById("log-container");
    var filterInput = document.getElementById("log-filter");
    var daySelect = document.getElementById("log-day-select");
    var isCurrent = {{ "true" if selected_day == "current" else "false" }};

    function applyFilter() {
      var needle = filterInput.value.toLowerCase();
      container.querySelectorAll(".log-line").forEach(function (line) {
        line.hidden = needle !== "" && !line.textContent.toLowerCase().includes(needle);
      });
    }
    filterInput.addEventListener("input", applyFilter);

    daySelect.addEventListener("change", function () {
      var value = daySelect.value;
      window.location.href = value === "current" ? "/logs" : "/logs?day=" + encodeURIComponent(value);
    });

    if (isCurrent) {
      function isScrolledToBottom() {
        return container.scrollTop + container.clientHeight >= container.scrollHeight - 20;
      }

      container.scrollTop = container.scrollHeight;

      var source = new EventSource("/logs/stream");
      source.onmessage = function (event) {
        var stickToBottom = isScrolledToBottom();
        container.insertAdjacentHTML("beforeend", event.data);
        applyFilter();
        if (stickToBottom) {
          container.scrollTop = container.scrollHeight;
        }
      };
    }
  })();
</script>
{% endblock %}
