{# app/templates/added.html #}
{% extends "base.html" %}
{% block content %}
<span class="section-tag">04 · Added</span>
<h1 class="page-title">Torrents added by cross-seed</h1>

<div class="log-controls">
  <input type="text" id="added-search" class="log-filter" placeholder="Search by name...">
  <select id="added-date" class="log-day-select">
    <option value="">All dates</option>
  </select>
</div>

<div id="added-content" hx-get="/added/refresh" hx-trigger="every 30s" hx-swap="innerHTML">
  {% include "_added_list.html" %}
</div>
<p id="added-filter-empty" class="meta" hidden>No matches.</p>

<script>
  (function () {
    var container = document.getElementById("added-content");
    var searchInput = document.getElementById("added-search");
    var dateInput = document.getElementById("added-date");
    var emptyNotice = document.getElementById("added-filter-empty");

    function refreshDateOptions() {
      var current = dateInput.value;
      var dates = new Set();
      container.querySelectorAll(".added-day").forEach(function (day) {
        dates.add(day.dataset.day);
      });
      var sorted = Array.from(dates).sort().reverse();
      dateInput.innerHTML = '<option value="">All dates</option>' + sorted.map(function (d) {
        return '<option value="' + d + '">' + d + "</option>";
      }).join("");
      dateInput.value = sorted.indexOf(current) !== -1 ? current : "";
    }

    function applyFilter() {
      var needle = searchInput.value.trim().toLowerCase();
      var day = dateInput.value;
      var rows = container.querySelectorAll(".added-row");
      var visibleCount = 0;
      rows.forEach(function (row) {
        var name = row.querySelector(".added-name").textContent.toLowerCase();
        var matchesName = needle === "" || name.includes(needle);
        // A torrent matches a day if any of its injections happened that day;
        // its other days are dimmed so the matching one stands out.
        var matchesDay = day === "";
        row.querySelectorAll(".added-day").forEach(function (dayEl) {
          var onDay = day === "" || dayEl.dataset.day === day;
          dayEl.classList.toggle("dim", !onDay);
          if (onDay) matchesDay = true;
        });
        row.hidden = !(matchesName && matchesDay);
        if (!row.hidden) visibleCount++;
      });
      emptyNotice.hidden = !(rows.length > 0 && visibleCount === 0);
    }

    searchInput.addEventListener("input", applyFilter);
    dateInput.addEventListener("change", applyFilter);
    document.body.addEventListener("htmx:afterSwap", function (event) {
      if (event.target && event.target.id === "added-content") {
        refreshDateOptions();
        applyFilter();
      }
    });
    refreshDateOptions();
    applyFilter();
  })();
</script>
{% endblock %}
