<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cross-Seed Companion</title>
  <script src="/static/vendor/htmx.min.js"></script>
  <style>
    :root {
      --bg: #0b0c0e;
      --bg-raised: #14161a;
      --fg: #e8e6e1;
      --fg-dim: #83807a;
      --accent: #f5a623;
      --accent-dim: #7a5518;
      --danger: #e5484d;
      --border: #23262b;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header.topbar .brand {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    .section-tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    h1.page-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 1.75rem;
    }
    table.diff {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    table.diff td {
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }
    td.added { color: var(--accent); }
    td.removed { color: var(--fg-dim); text-decoration: line-through; }
    .meta {
      color: var(--fg-dim);
      font-family: var(--mono);
      font-size: 0.78rem;
      margin-bottom: 1.25rem;
    }
    .actions { margin-top: 1.5rem; }
    button, .btn {
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover, .btn:hover {
      background: var(--accent);
      color: #14100a;
      border-color: var(--accent);
    }
    .notice {
      border: 1px solid var(--border);
      background: var(--bg-raised);
      padding: 0.9rem 1rem;
      font-size: 0.85rem;
    }
    .notice a { color: var(--accent); }
    .error-box {
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.9rem 1rem;
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    .error-tag {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.4rem;
    }
    nav.tabs {
      display: flex;
      gap: 1.25rem;
    }
    nav.tabs a {
      color: var(--fg-dim);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    nav.tabs a:hover {
      color: var(--fg);
    }
    .actions-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border: 1px solid var(--border);
      padding: 0.7rem 0.9rem;
    }
    .action-row .action-title {
      flex: 1;
      font-size: 0.85rem;
    }
    .action-row input[type="text"] {
      font-family: var(--mono);
      font-size: 0.8rem;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.4rem 0.6rem;
      border-radius: 3px;
    }
    .ping-badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    .ping-ok { color: var(--accent); }
    .ping-down { color: var(--danger); }
    .log-filter {
      width: 100%;
      font-family: var(--mono);
      font-size: 0.8rem;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.5rem 0.7rem;
      border-radius: 3px;
      margin-bottom: 1rem;
    }
    .log-container {
      height: 60vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
    }
    .log-line {
      font-family: var(--mono);
      font-size: 0.78rem;
      white-space: pre-wrap;
      padding: 0.15rem 0;
      border-bottom: 1px solid var(--border);
    }
    .log-time { color: var(--fg-dim); }
    .log-tag { text-transform: uppercase; font-weight: 600; margin: 0 0.4rem; }
    .log-component { color: var(--accent); margin-right: 0.4rem; }
    .log-line.log-level-error { color: var(--danger); }
    .log-line.log-level-verbose { color: var(--fg-dim); }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Cross-Seed Companion</span>
    <nav class="tabs">
      <a href="/sync">Sync</a>
      <a href="/actions">Actions</a>
      <a href="/logs">Logs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
