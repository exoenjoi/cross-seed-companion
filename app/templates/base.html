<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cross-Seed Companion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23f5a623%22/></svg>">
  <script src="/static/vendor/htmx.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c0e;
      --bg-raised: #14161a;
      --fg: #e8e6e1;
      --fg-dim: #83807a;
      --accent: #f5a623;
      --accent-dim: #7a5518;
      --danger: #e5484d;
      --border: #23262b;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    a:focus-visible,
    button:focus-visible,
    .btn:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:disabled, .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    ::selection {
      background: var(--accent-dim);
      color: var(--fg);
    }
    .log-container {
      scrollbar-color: var(--border) var(--bg-raised);
      scrollbar-width: thin;
    }
    .log-container::-webkit-scrollbar { width: 10px; }
    .log-container::-webkit-scrollbar-track { background: var(--bg-raised); }
    .log-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    .log-container::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header.topbar .brand {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    .section-tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    h1.page-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 0 0 1.75rem;
    }
    .table-scroll {
      overflow-x: auto;
    }
    table.diff {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    table.diff th {
      padding: 0.4rem 0.6rem;
      text-align: left;
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.diff th.sortable {
      cursor: pointer;
      user-select: none;
    }
    table.diff th.sortable:hover { color: var(--accent); }
    table.diff th.sortable::after {
      content: "↕";
      margin-left: 0.3em;
      opacity: 0.4;
    }
    table.diff th.sortable[data-sort-dir="asc"]::after { content: "↑"; opacity: 1; }
    table.diff th.sortable[data-sort-dir="desc"]::after { content: "↓"; opacity: 1; }
    table.diff td {
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tr.added td { color: var(--accent); }
    tr.removed td { color: var(--fg-dim); text-decoration: line-through; }
    .idx-sign {
      display: inline-block;
      width: 1em;
    }
    .idx-name {
      font-family: var(--sans);
      font-weight: 600;
    }
    .idx-privacy {
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--fg-dim);
    }
    .idx-privacy-public { color: var(--danger); }
    .idx-privacy-semiprivate { color: var(--accent); }
    .idx-id, .idx-added {
      color: var(--fg-dim);
      font-size: 0.78rem;
    }
    .idx-url {
      color: var(--fg-dim);
      font-size: 0.78rem;
    }
    .meta {
      color: var(--fg-dim);
      font-family: var(--mono);
      font-size: 0.78rem;
      margin-bottom: 1.25rem;
    }
    .actions { margin-top: 1.5rem; }
    button, .btn {
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover, .btn:hover {
      background: var(--accent);
      color: #14100a;
      border-color: var(--accent);
    }
    .notice {
      border: 1px solid var(--border);
      background: var(--bg-raised);
      padding: 0.9rem 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .notice a { color: var(--accent); }
    .error-box {
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.9rem 1rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      white-space: pre-wrap;
    }
    .error-tag {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.4rem;
    }
    nav.tabs {
      display: flex;
      gap: 1.25rem;
    }
    nav.tabs a {
      color: var(--fg-dim);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    nav.tabs a:hover {
      color: var(--fg);
    }
    nav.tabs a[aria-current="page"] {
      color: var(--accent);
    }
    .actions-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .action-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border: 1px solid var(--border);
      padding: 0.7rem 0.9rem;
    }
    .action-row-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .action-row-main .action-title {
      flex: 1;
      font-size: 0.85rem;
    }
    .action-row-main input[type="text"] {
      font-family: var(--mono);
      font-size: 0.8rem;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.4rem 0.6rem;
      border-radius: 3px;
    }
    .action-api {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--fg-dim);
      overflow-wrap: anywhere;
    }
    .ping-badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    .ping-ok { color: var(--accent); }
    .ping-down { color: var(--danger); }
    .log-controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .log-filter, .log-day-select {
      font-family: var(--mono);
      font-size: 0.8rem;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 0.5rem 0.7rem;
      border-radius: 3px;
    }
    .log-filter { flex: 1; }
    .log-level-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .log-level-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--fg-dim);
    }
    .log-level-filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .log-level-hint {
      font-size: 0.75rem;
      color: var(--fg-dim);
    }
    .level-chip {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: transparent;
      color: var(--fg-dim);
      border: 1px solid var(--border);
      padding: 0.3rem 0.6rem;
      border-radius: 3px;
      cursor: pointer;
    }
    .level-chip.active {
      color: var(--bg);
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .log-container {
      height: 60vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
    }
    .log-line {
      font-family: var(--mono);
      font-size: 0.78rem;
      white-space: pre-wrap;
      padding: 0.15rem 0;
      border-bottom: 1px solid var(--border);
    }
    .log-time { color: var(--fg-dim); }
    .log-tag { text-transform: uppercase; font-weight: 600; margin: 0 0.4rem; }
    .log-component { color: var(--accent); margin-right: 0.4rem; }
    .log-line.log-level-error { color: var(--danger); }
    .log-line.log-level-verbose { color: var(--fg-dim); }
    .added-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .added-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0;
      font-size: 0.85rem;
    }
    .added-row[hidden] {
      display: none;
    }
    .added-name {
      overflow-wrap: anywhere;
    }
    .added-meta {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--fg-dim);
    }
    .app-footer {
      text-align: center;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--fg-dim);
      padding: 0 1rem 1.5rem;
    }
    @media (max-width: 640px) {
      header.topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
      }
      nav.tabs {
        flex-wrap: wrap;
        gap: 0.9rem;
      }
      main {
        padding: 1.5rem 1rem 3rem;
      }
      .action-row-main {
        flex-direction: column;
        align-items: stretch;
      }
      .log-controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Cross-Seed Companion</span>
    <nav class="tabs">
      <a href="/sync" {% if request.url.path.startswith('/sync') %}aria-current="page"{% endif %}>Sync</a>
      <a href="/actions" {% if request.url.path.startswith('/actions') %}aria-current="page"{% endif %}>Actions</a>
      <a href="/logs" {% if request.url.path.startswith('/logs') %}aria-current="page"{% endif %}>Logs</a>
      <a href="/added" {% if request.url.path.startswith('/added') %}aria-current="page"{% endif %}>Added</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="app-footer">Cross-Seed Companion {{ app_version() }}</footer>
</body>
</html>
