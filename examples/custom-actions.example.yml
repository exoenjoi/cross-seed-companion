# Exemple de fichier d'actions custom pour Cross-Seed Companion.
# Montez ce fichier (ou une copie modifiée) dans le container et pointez
# ACTIONS_CONFIG_PATH vers son chemin monté. Même schéma que les actions
# intégrées : id, title, method, url, body (optionnel), confirm (optionnel),
# input_label (optionnel, ajoute un champ texte libre passé comme ${INPUT}).
#
# Variables disponibles dans url/body : ${CROSSSEED_URL}, ${CROSSSEED_API_KEY},
# ${PROWLARR_URL}, ${PROWLARR_API_KEY}, ${INPUT} (uniquement si input_label
# est défini). Toute autre variable fait échouer l'action avec un message
# d'erreur explicite — jamais d'exécution shell, jamais de code arbitraire.
# ${INPUT} n'est pas encodé pour une URL : utilisez-le dans "body", pas dans
# "url" (un espace, un "&" ou un "#" dans la valeur saisie casserait l'URL).

- id: force-full-search-slow
  title: "Recherche complète (variante custom)"
  method: POST
  url: "${CROSSSEED_URL}/api/job?apikey=${CROSSSEED_API_KEY}"
  body:
    name: search
    ignoreExcludeOlder: true
  confirm: "Exemple d'action custom : lance une recherche en ignorant les anciens torrents exclus. Confirmer ?"
