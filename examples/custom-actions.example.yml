# Example custom actions file for Cross-Seed Companion.
# Mount this file (or an edited copy) into the container and point
# ACTIONS_CONFIG_PATH at its mounted path. Same schema as the built-in
# actions:
#   id, title, method, url          required
#   body                            optional, sent as JSON
#   headers                         optional, HTTP headers (e.g. X-Api-Key)
#   confirm                         optional, asks for confirmation before the call
#   input_label                     optional, adds a free-text field passed as ${INPUT}
#   statuses                        optional, HTTP status code -> message shown
#                                   instead of the raw response body
#
# Variables available in url/body/headers: ${CROSSSEED_URL},
# ${CROSSSEED_API_KEY}, ${PROWLARR_URL}, ${PROWLARR_API_KEY}, ${INPUT}
# (only when input_label is set). Any other variable makes the action fail
# with an explicit error message; there is never any shell execution or
# arbitrary code.
# ${INPUT} is URL-encoded inside "url" and sent as-is inside "body".
#
# Pass the API key in an X-Api-Key header rather than in the URL
# (?apikey=...): it then stays out of access logs.
#
# All options of cross-seed's API:
# https://www.cross-seed.org/docs/reference/api

- id: force-full-search-slow
  title: "Full search (custom variant)"
  method: POST
  url: "${CROSSSEED_URL}/api/job"
  headers:
    X-Api-Key: "${CROSSSEED_API_KEY}"
  body:
    name: search
    ignoreExcludeOlder: true
  confirm: "Custom action example: runs a search that ignores the older-torrent exclusion. Confirm?"
  statuses:
    409: "Already running, or too close to the next scheduled run."

# The webhook accepts more options (ignoreBlockList, includeNonVideos, ...):
# duplicate an action and set them in the body.
- id: search-torrent-including-non-videos
  title: "Search a torrent by infoHash (including non-video files)"
  method: POST
  url: "${CROSSSEED_URL}/api/webhook"
  headers:
    X-Api-Key: "${CROSSSEED_API_KEY}"
  body:
    infoHash: "${INPUT}"
    includeNonVideos: true
  input_label: "Torrent infoHash"
