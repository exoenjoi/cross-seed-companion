name: Build image

# main   -> ghcr.io/<repo>:edge (overwritten on every build)
# v*.*.* -> ghcr.io/<repo>:<version>, :<major>.<minor> and :latest
# Each build ends by deleting superseded untagged images (only the 5 newest are kept).

on:
  push:
    branches: [main]
    # Docs, tests and examples don't change the image: don't build one for them.
    paths-ignore: ["**.md", "docs/**", "tests/**", "examples/**", ".env.example", "docker-compose.example.yml"]
    tags: ["v*.*.*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          # No provenance attestation: it adds untagged child manifests that the
          # cleanup job below could mistake for garbage and delete, breaking the tagged image.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A superseded :edge (or moved :latest) image becomes untagged; tagged
      # images (releases, current edge/latest) are never touched.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
          # Children (amd64 image + attestation) of v0.1.0, built before provenance was
          # disabled. Remove this line once 0.1.0 is retired.
          ignore-versions: '^sha256:(80af749eba68|ae189829cef9)'
